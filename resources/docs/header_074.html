<h1><a id="_Toc169638754"></a>Проекты </h1>
<p>Так как программа для ЭВМ «Uniskad 3.0» предназначена для работы с изделиями/испытаниями, то для работы с данными, которые привязаны к изделиям были придуманы «Проекты». Под проектами подразумевается совокупность таблиц данных, графиков и полей, построенных на основе данных, формул.</p>
