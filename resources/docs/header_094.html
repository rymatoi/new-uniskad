<h2><a id="_Toc169638774"></a>Удаление столбца в таблице</h2>
<p>Также у пользователя есть возможность удалить столбец. Необходимо навести курсор мыши на названия столбца, либо выделить весь столбец, затем кликнуть правой кнопкой мыши и выбрать пункт «Удалить», после этого данный столбец будет удален. </p>
